# XcodeGen spec. Regenerate the project after editing: `cd ios && xcodegen`.
name: WeatherPet
options:
  bundleIdPrefix: com.weatherpet
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "103"
    SWIFT_VERSION: "6.0"
    # Set your team for device builds, e.g. in Xcode's Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  CompanionCore:
    path: CompanionCore
targets:
  WeatherPet:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - package: CompanionCore
        product: CompanionScene
      - target: WeatherPetWatch
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小院天气
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.weather
        NSLocationWhenInUseUsageDescription: 用于获取当地实时天气。只在打开小院时定位一次，不会在后台追踪。
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIImageName: Portrait
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_NAME: WeatherPet
        PRODUCT_BUNDLE_IDENTIFIER: com.weatherpet.weatherPet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - package: CompanionCore/CompanionCoreTests
  WeatherPetWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - package: CompanionCore
        product: CompanionScene
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 小院天气
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.weatherpet.weatherPet
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: 用于获取当地实时天气。只在打开小院时定位一次，不会在后台追踪。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: WeatherPetWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.weatherpet.weatherPet.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
