name: weather_pet
description: "天气小人 - 轻量桌面天气宠物"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  geolocator: ^13.0.2
  shared_preferences: ^2.3.5
  lottie: ^3.3.1
  rive: ^0.13.0
  battery_plus: ^7.0.0
  connectivity_plus: ^7.1.1
  sensors_plus: ^6.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/rive/
