name: Weather pet iOS release
run-name: ${{ inputs.release_id || format('Manual {0} ({1})', inputs.build_name, inputs.build_number) }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional server release correlation ID
        required: false
        type: string
      build_name:
        description: Marketing version
        required: true
        default: '1.0.0'
      build_number:
        description: Unique ascending Apple build number
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: weather_pet_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (advisory)
        run: flutter analyze || echo "::warning::analyze reported issues; build continues"
      - name: Build unsigned device app
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: flutter build ios --release --no-codesign --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
      - name: Package unsigned IPA for signing on server
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          cd build/unsigned
          zip -qry ../weatherpet-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: weatherpet-ios-unsigned-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: weather_pet_app/build/weatherpet-ios-unsigned.ipa
          retention-days: 7

  screenshots:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: weather_pet_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Boot simulator, grant location, capture screenshots
        run: |
          set -x
          RID=$(xcrun simctl list runtimes | grep iOS | tail -1 | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | head -1)
          DEVTYPE=$(xcrun simctl list devicetypes | grep iPhone | grep -E 'Pro Max|Plus' | tail -1 | grep -oE 'com.apple.CoreSimulator.SimDeviceType.[A-Za-z0-9-]+' | head -1)
          echo "runtime=$RID devicetype=$DEVTYPE"
          NAME="wp-shots"
          xcrun simctl create "$NAME" "$DEVTYPE" "$RID"
          UDID=$(xcrun simctl list devices | grep "$NAME (" | grep -oE '[A-F0-9-]{36}' | head -1)
          echo "udid=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant location com.weatherpet.weatherPet
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl location "$UDID" set 39.9042,116.4074
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 88 --wifiBars 3 --cellularBars 4
          xcrun simctl launch "$UDID" com.weatherpet.weatherPet
          sleep 15
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/shot-1.png
          sleep 5
          xcrun simctl status_bar "$UDID" override --time "21:30" --batteryLevel 66
          xcrun simctl io "$UDID" screenshot shots/shot-2.png
          xcrun simctl terminate "$UDID" com.weatherpet.weatherPet || true
          sips -g pixelWidth -g pixelHeight shots/shot-1.png
      - name: Normalize to 6.9 inch (1290x2796)
        run: |
          mkdir -p shots69
          for f in shots/*.png; do
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            if [ "$W" = "1320" ] || [ "$W" = "1290" ]; then
              cp "$f" "shots69/$(basename $f)"
            else
              sips -z 2796 1290 "$f" --out "shots69/$(basename $f)" >/dev/null
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: weatherpet-screenshots
          path: weather_pet_app/shots69/
          retention-days: 7
